# Spectrogram Labeling Tool Configuration

# Data paths
data:
  folder: "data/ICLISTENHF6406/sampling_2023-10-10_to_2024-08-07/mat/processed"  # Path to folder containing spectrogram files
  audio_folder: "data/ICLISTENHF6406/sampling_2023-10-10_to_2024-08-07/flac"   # Path to folder containing audio files (.flac)
  output_file: "data/ICLISTENHF6406/sampling_2023-10-10_to_2024-08-07/labels.json"        # Path to output file for saving labeled filenames

# Display settings
display:
  target_dim: [512, 512]           # Target dimensions [height, width] for reshaping the data
  specs_per_page: 25               # Number of spectrograms to display per page
  y_axis_scale: "linear"           # Y-axis scaling: "linear" or "log" (logarithmic like mel spectrograms)

# Audio settings
audio:
  enable: true                     # Whether to enable audio playback
  auto_match: true                 # Whether to automatically match audio files to spectrograms

# Labeling options - Now using hierarchical system
labels:
  # Enable hierarchical labeling system (set to false to use old flat system)
  use_hierarchical: true
  
  # Legacy flat labels (for backward compatibility when use_hierarchical is false)
  available:                       
    - "Rain"
    - "Engine Noise"
    - "Unknown Features"
    - "Biological Sounds"
    - "Ambient Noise"

  # Hierarchical labeling configuration
  hierarchical:
    # Support for partial path selection (allows stopping at any level)
    allow_partial_paths: true
    
    # Search configuration
    search:
      enable: true                 # Enable search functionality
      placeholder: "Search labels..." # Placeholder text for search box
      
    # UI configuration
    ui:
      max_tree_height: "400px"     # Maximum height of the tree view
      show_breadcrumbs: true       # Show breadcrumb navigation for selected items
      collapsible_nodes: true      # Allow expanding/collapsing tree nodes
      
# Cache settings
cache:
  max_size: 400                    # Maximum number of images to cache
  preload_next_page: true          # Whether to preload images for the next page 