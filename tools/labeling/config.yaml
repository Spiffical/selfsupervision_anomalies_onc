# Spectrogram Labeling Tool Configuration

# Data paths
data:
  folder: "data/ICLISTENHF6406/sampling_2023-10-10_to_2024-10-09/mat/processed"  # Path to folder containing spectrogram files
  audio_folder: "data/ICLISTENHF6406/sampling_2023-10-10_to_2024-10-09/flac"   # Path to folder containing audio files (.flac)
  output_file: "data/ICLISTENHF6406/sampling_2023-10-10_to_2024-10-09/labels.json"        # Path to output file for saving labeled filenames

# Display settings
display:
  target_dim: [512, 512]           # Target dimensions [height, width] for reshaping the data
  specs_per_page: 25               # Number of spectrograms to display per page
  y_axis_scale: "linear"           # Y-axis scaling: "linear" or "log" (logarithmic like mel spectrograms)

# Audio settings
audio:
  enable: true                     # Whether to enable audio playback
  auto_match: true                 # Whether to automatically match audio files to spectrograms

# Labeling options
labels:
  available:                       # Labels available for selection
    - "Rain"
    - "Engine Noise"
    - "Unknown Features"
    - "Biological Sounds"
    - "Ambient Noise"

# Cache settings
cache:
  max_size: 400                    # Maximum number of images to cache
  preload_next_page: true          # Whether to preload images for the next page 